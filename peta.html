.grab{display:none}

.it{position:relative;padding:11px 10px 11px 46px;border-radius:12px;cursor:pointer;transition:background .15s;font-size:.88rem;font-weight:500}
.it:hover{background:var(--soft)}
.it.sel{background:var(--bs)}.it.sel .nm{color:var(--b);font-weight:700}
.it::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:var(--b);opacity:.2}
.it.f::before{top:50%}.it.l::before{bottom:50%}
.it .n{position:absolute;left:10px;top:50%;margin-top:-12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.66rem;font-weight:700;background:var(--card);color:var(--b);border:2px solid var(--b)}
